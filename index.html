<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Mesh Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg1"></div>
<div class="bg2"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">

        <div class="header">
            <h1>WIRE MESH MICRON CALCULATOR</h1>
            <p>Industrial Mesh Analysis Dashboard</p>
        </div>

        <div class="dashboard">

            <div class="glass input-panel">

                <h2>Input Parameters</h2>
                <div class="input-group">
                    <label>Weave Type</label>

                    <select id="weaveType">
                        <option value="plain">
                            Plain / Twill Weave
                        </option>

                        <option value="dutch">
                            Plain Dutch / Twill Dutch
                        </option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Warp Mesh</label>
                    <input type="number" id="warpMesh">
                </div>

                <div class="input-group">
                    <label>Weft Mesh</label>
                    <input type="number" id="weftMesh">
                </div>

                <div class="input-group">
                    <label>Warp Wire Diameter (D)</label>
                    <input type="number" step="0.001" id="warpDia">
                </div>

                <div class="input-group">
                    <label>Weft Wire Diameter (d)</label>
                    <input type="number" step="0.001" id="weftDia">
                </div>

                

                <button onclick="calculateMesh()">
                    Calculate
                </button>

            </div>

            <div class="result-panel">

                <div class="card">
                    <span>Opening</span>
                    <h3 id="opening">0</h3>
                    <small>Micron</small>
                </div>

                <div class="card">
                    <span>Thickness</span>
                    <h3 id="thickness">0</h3>
                    <small>mm</small>
                </div>

                <div class="card">
                    <span id="dynamicTitle">
                        Open Area
                    </span>
                    <h3 id="dynamicValue">0</h3>
                    <small id="dynamicUnit">%</small>
                </div>

                <div class="card">
                    <span>Weight</span>
                    <h3 id="weight">0</h3>
                    <small>Kg/m²</small>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
