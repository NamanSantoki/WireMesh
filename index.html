

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<title>Premium Wire Mesh Micron Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #2a2a2a 0%, #101010 40%, #050505 100%);
        color: white;
        overflow-x: hidden;
        padding: 20px;
        position: relative;
    }

    /* BACKGROUND GLOW */

    .bg1,
    .bg2 {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        z-index: 0;
    }

    .bg1 {
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.05);
        top: -100px;
        left: -100px;
        animation: move1 7s infinite alternate ease-in-out;
    }

    .bg2 {
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.03);
        bottom: -80px;
        right: -80px;
        animation: move2 8s infinite alternate ease-in-out;
    }

    @keyframes move1 {
        from {
            transform: translateY(0px);
        }

        to {
            transform: translateY(30px);
        }
    }

    @keyframes move2 {
        from {
            transform: translateY(0px);
        }

        to {
            transform: translateY(-30px);
        }
    }

    .container {
        width: 100%;
        max-width: 1300px;
        margin: auto;
        position: relative;
        z-index: 2;
    }

    /* HEADER */

    .header {
        text-align: center;
        margin-bottom: 30px;
        animation: fadeDown 1s ease;
    }

    .header h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 700;
        letter-spacing: 2px;
    }

    .header p {
        color: #bdbdbd;
        margin-top: 10px;
        font-size: clamp(0.85rem, 2vw, 1rem);
    }

    @keyframes fadeDown {
        from {
            opacity: 0;
            transform: translateY(-40px);
        }

        to {
            opacity: 1;
            transform: translateY(0px);
        }
    }

    /* GLASS CARD */

    .glass {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border-radius: 28px;
        padding: clamp(20px, 4vw, 40px);
        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.6),
            inset 0 0 20px rgba(255, 255, 255, 0.03);
        animation: fadeUp 1s ease;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }

        to {
            opacity: 1;
            transform: translateY(0px);
        }
    }

    /* INPUT GRID */

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 22px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
    }

    .input-group label {
        margin-bottom: 8px;
        color: #d6d6d6;
        font-size: 0.95rem;
    }

    .input-group input,
    .input-group select {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid transparent;
        outline: none;
        padding: 15px;
        border-radius: 16px;
        color: white;
        font-size: 1rem;
        transition: 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
        border: 1px solid rgba(255, 255, 255, 0.4);
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    option {
        background: #111;
    }

    /* BUTTON */

    .button-area {
        text-align: center;
        margin-top: 35px;
    }

    button {
        border: none;
        outline: none;
        padding: 16px 45px;
        border-radius: 50px;
        background: linear-gradient(135deg, #ffffff, #bfbfbf);
        color: #111;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.4s;
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
    }

    button:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2);
    }

    /* RESULT SECTION */

    .results {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 22px;
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 22px;
        padding: 25px;
        text-align: center;
        transition: 0.4s;
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: "";
        position: absolute;
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
        top: -50px;
        right: -50px;
    }

    .card:hover {
        transform: translateY(-8px);
        background: rgba(255, 255, 255, 0.07);
    }

    .card h3 {
        color: #d9d9d9;
        margin-bottom: 15px;
        font-size: 1rem;
        font-weight: 500;
    }

    .card p {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        word-break: break-word;
    }

    /* FORMULA SECTION */

    .formulas {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }

    .formula-box {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .formula-box h2 {
        margin-bottom: 15px;
        font-size: 1.2rem;
    }

    .formula-box p {
        color: #cfcfcf;
        line-height: 1.8;
        font-size: 0.95rem;
    }

    /* FOOTER */

    .footer {
        text-align: center;
        margin-top: 35px;
        color: #9b9b9b;
        font-size: 0.9rem;
    }

    /* MOBILE */

    @media(max-width:600px) {

        body {
            padding: 15px;
        }

        .glass {
            padding: 18px;
            border-radius: 20px;
        }

        .card {
            padding: 20px;
        }

        button {
            width: 100%;
        }
    }
</style>
<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>WIRE MESH MICRON CALCULATOR</h1>
        <p>Premium Responsive Plain & Dutch Weave System</p>
    </div>

    <!-- MAIN CARD -->

    <div class="glass">

        <!-- INPUTS -->

        <div class="grid">

            <div class="input-group">
                <label>Warp Mesh</label>
                <input type="number" id="warpMesh" placeholder="Enter Warp Mesh">
            </div>

            <div class="input-group">
                <label>Weft Mesh</label>
                <input type="number" id="weftMesh" placeholder="Enter Weft Mesh">
            </div>

            <div class="input-group">
                <label>Warp Wire Diameter (D)</label>
                <input type="number" id="warpDia" placeholder="Enter Warp Diameter">
            </div>

            <div class="input-group">
                <label>Weft Wire Diameter (d)</label>
                <input type="number" id="weftDia" placeholder="Enter Weft Diameter">
            </div>

            <div class="input-group">
                <label>Weave n Type</label>

                <select id="weaveType">
                    <option value="plain">Plain/Twill Weave</option>
                    <option value="dutch">PLain Dutch/Twill Dutch Weave</option>
                </select>
            </div>

        </div>

        <!-- BUTTON -->

        <div class="button-area">
            <button onclick="calculateMesh()">
                Calculate Now
            </button>
        </div>

        <!-- RESULTS -->

        <div class="results">

            <div class="card">
                <h3>Opening (Micron)</h3>
                <p id="opening">0</p>
            </div>

            <div class="card">
                <h3>Thickness (mm)</h3>
                <p id="thickness">0</p>
            </div>

            <div class="card">
                <h3>Constant</h3>
                <p id="constant">0</p>
            </div>

            <div class="card">
                <h3>Weight / m²</h3>
                <p id="weight">0</p>
            </div>

        </div>

        <!-- FORMULAS -->

        
    </div>

    <!-- FOOTER -->

    <div class="footer">
        Fully Responsive • Mobile Optimized • Rich Glass UI
    </div>

</div>

<!-- JAVASCRIPT -->

<script>

    function calculateMesh() {

        let warpMesh =
            parseFloat(document.getElementById("warpMesh").value) || 0;

        let weftMesh =
            parseFloat(document.getElementById("weftMesh").value) || 0;

        let D =
            parseFloat(document.getElementById("warpDia").value) || 0;

        let d =
            parseFloat(document.getElementById("weftDia").value) || 0;

        let weaveType =
            document.getElementById("weaveType").value;

        let opening = 0;
        let thickness = 0;
        let constant = 0;
        let weight = 0;

        /* DUTCH WEAVE */

        if (weaveType === "dutch") {

            let L = 25.4 / warpMesh;

            opening =
                (D *
                ((L - D - d) /
                    (L + D + d)))*1000;

            thickness =
                D + d + d;

            constant =
                weftMesh * d;

            weight =
                ((D * D * 0.493 * warpMesh) / 2)
                +
                (d * d * 0.493 * weftMesh)/2;

        }

        /* PLAIN WEAVE */

        else {

            opening =
                ((25.4 / warpMesh) - D)*1000;

            thickness =
                 D*2 ;

            constant =
                weftMesh * d;

            weight =
                D * D * 0.493 * warpMesh;

        }

        /* SHOW RESULTS */

      document.getElementById("opening").innerHTML =
    Math.round(opening);

document.getElementById("thickness").innerHTML =
    thickness.toFixed(3); 

document.getElementById("constant").innerHTML =
    Math.round(constant);

document.getElementById("weight").innerHTML =
    weight.toFixed(2) + " Kg";

    }
    

</script>
